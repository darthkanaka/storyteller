<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Time Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            transition: background 0.5s ease;
        }

        /* Emotional tier backgrounds */
        body.tier-celebration {
            background: linear-gradient(135deg, #fbbf24 0%, #f472b6 50%, #a78bfa 100%);
        }
        body.tier-satisfied {
            background: linear-gradient(135deg, #4ade80 0%, #22d3ee 50%, #818cf8 100%);
        }
        body.tier-reflective {
            background: linear-gradient(135deg, #94a3b8 0%, #a78bfa 50%, #f0abfc 100%);
        }
        body.tier-uncomfortable {
            background: linear-gradient(135deg, #fbbf24 0%, #fb923c 50%, #94a3b8 100%);
        }
        body.tier-disappointed {
            background: linear-gradient(135deg, #64748b 0%, #94a3b8 50%, #a78bfa 100%);
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .part-content {
            animation: slideIn 0.4s ease-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 40px rgba(251, 191, 36, 0.8); }
        }

        .bounce {
            animation: bounce 2s infinite;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .glow {
            animation: glow 2s infinite;
        }

        .choice-btn {
            transition: all 0.3s ease;
        }

        .choice-btn:hover {
            transform: scale(1.05);
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        .good-choice {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 8px 0 #16a34a, 0 15px 20px rgba(0,0,0,0.2);
        }

        .good-choice:active {
            box-shadow: 0 4px 0 #16a34a, 0 8px 15px rgba(0,0,0,0.2);
            transform: translateY(4px) scale(0.95);
        }

        .other-choice {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 8px 0 #d97706, 0 15px 20px rgba(0,0,0,0.2);
        }

        .other-choice:active {
            box-shadow: 0 4px 0 #d97706, 0 8px 15px rgba(0,0,0,0.2);
            transform: translateY(4px) scale(0.95);
        }

        .continue-btn {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            box-shadow: 0 6px 0 #2563eb, 0 12px 20px rgba(0,0,0,0.2);
        }

        .continue-btn:active {
            box-shadow: 0 3px 0 #2563eb, 0 6px 15px rgba(0,0,0,0.2);
            transform: translateY(3px);
        }

        .start-btn {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
            box-shadow: 0 10px 0 #be185d, 0 20px 30px rgba(0,0,0,0.3);
        }

        .start-btn:active {
            box-shadow: 0 5px 0 #be185d, 0 10px 20px rgba(0,0,0,0.3);
            transform: translateY(5px);
        }

        .story-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .character-badge {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
        }

        /* Part type styles */
        .part-opening {
            border-left: 4px solid #818cf8;
            background: linear-gradient(135deg, #ede9fe 0%, #e0e7ff 100%);
        }

        .part-consequence {
            border-left: 4px solid #f472b6;
            background: linear-gradient(135deg, #fce7f3 0%, #fdf2f8 100%);
        }

        .part-transition {
            border-left: 4px solid #60a5fa;
            background: linear-gradient(135deg, #dbeafe 0%, #e0f2fe 100%);
        }

        .part-decision {
            border-left: 4px solid #fbbf24;
            background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 100%);
        }

        .part-goal-resolution {
            border-left: 4px solid #4ade80;
            background: linear-gradient(135deg, #dcfce7 0%, #f0fdf4 100%);
        }

        .part-reflection {
            border-left: 4px solid #a78bfa;
            background: linear-gradient(135deg, #f3e8ff 0%, #faf5ff 100%);
        }

        .part-resolution {
            border-left: 4px solid #10b981;
            background: linear-gradient(135deg, #d1fae5 0%, #ecfdf5 100%);
        }

        body.tier-hopeful {
            background: linear-gradient(135deg, #fbbf24 0%, #4ade80 50%, #22d3ee 100%);
        }

        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: fall 3s linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .stars {
            position: fixed;
            pointer-events: none;
        }

        .star {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 1s ease-in-out forwards;
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
            100% { opacity: 0; transform: scale(0.5) rotate(360deg); }
        }

        /* Progress indicator */
        .progress-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: white;
            transform: scale(1.2);
        }

        .progress-dot.completed {
            background: #4ade80;
        }

        /* Story parts with visual separation */
        .story-part {
            margin-bottom: 1.5rem;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            animation: slideIn 0.4s ease-out;
        }

        .story-part.opening {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border-left: 4px solid #fb923c;
        }

        .story-part.consequence {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border-left: 4px solid #60a5fa;
        }

        .story-part.transition {
            background: linear-gradient(135deg, #fdf4ff 0%, #fae8ff 100%);
            border-left: 4px solid #e879f9;
        }

        .story-part.decision {
            background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
            border-left: 4px solid #facc15;
        }

        .story-part.resolution {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border-left: 4px solid #34d399;
        }

        .story-part .part-label-inline {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: #6b7280;
        }

        .story-part .part-text {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #374151;
        }

        .ending-info {
            text-align: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 16px;
            margin: 1rem 0;
        }

        .closing-feeling-box {
            font-style: italic;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
        }

        .final-message-box {
            font-size: 1rem;
            padding: 0.75rem;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        /* Parts container */
        #story-parts-container {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Start Screen -->
    <div id="start-screen" class="screen active flex-col items-center justify-center text-center w-full max-w-lg">
        <div class="mb-8">
            <span class="text-8xl bounce inline-block">📚</span>
        </div>
        <h1 class="text-5xl md:text-6xl font-extrabold text-white mb-4 drop-shadow-lg">
            Story Time!
        </h1>
        <p class="text-xl md:text-2xl text-white/90 mb-12 drop-shadow">
            Let's go on an adventure together!
        </p>
        <button onclick="startNewStory()" class="start-btn choice-btn text-white text-2xl md:text-3xl font-bold py-6 px-12 rounded-full">
            🌟 Start Adventure 🌟
        </button>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="screen flex-col items-center justify-center text-center">
        <div class="loading-spinner mb-6"></div>
        <p class="text-2xl text-white font-bold">Getting your story ready...</p>
    </div>

    <!-- Scene Screen (Three-Part Structure) -->
    <div id="scene-screen" class="screen flex-col items-center justify-center w-full max-w-2xl">
        <div class="story-card p-6 md:p-10 w-full">
            <!-- Progress Indicator -->
            <div class="progress-dots mb-6">
                <div id="dot-1" class="progress-dot"></div>
                <div id="dot-2" class="progress-dot"></div>
                <div id="dot-3" class="progress-dot"></div>
            </div>

            <!-- Character Badge (only on scene 1) -->
            <div id="character-badge-container" class="flex justify-center mb-6 hidden">
                <span class="character-badge text-white text-xl md:text-2xl font-bold py-2 px-6 rounded-full">
                    Meet <span id="character-name">...</span>!
                </span>
            </div>

            <!-- Part Icon -->
            <div class="text-center mb-4">
                <span id="part-icon" class="text-5xl">📖</span>
            </div>

            <!-- Part Label -->
            <div class="text-center mb-4">
                <span id="part-label" class="text-gray-500 text-sm uppercase tracking-wide font-semibold">Story</span>
            </div>

            <!-- Story Content (parts-based or single narrative) -->
            <div id="story-parts-container" class="mb-6">
                <!-- Parts will be inserted here dynamically -->
            </div>

            <!-- Fallback single narrative (hidden when using parts) -->
            <div id="part-content" class="part-content rounded-2xl p-6 mb-6 hidden">
                <p id="narrative-text" class="text-gray-700 text-xl md:text-2xl leading-relaxed">...</p>
            </div>

            <!-- Sub-lesson (shown during decision_setup) -->
            <div id="sub-lesson-container" class="bg-purple-100 rounded-2xl p-4 mb-6 text-center hidden">
                <span class="text-2xl">💡</span>
                <p id="sub-lesson" class="text-purple-700 font-semibold text-lg">...</p>
            </div>

            <!-- Emotional Beat -->
            <div id="emotional-beat-container" class="text-center mb-6">
                <span id="emotional-beat" class="text-gray-500 italic text-lg">...</span>
            </div>

            <!-- Continue Button (shown between parts) -->
            <div id="continue-container" class="flex justify-center hidden">
                <button onclick="showNextPart()" class="continue-btn choice-btn text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-full">
                    Continue ➡️
                </button>
            </div>

            <!-- Choice Buttons (only after decision_setup) -->
            <div id="choices-container" class="flex flex-col gap-4 hidden">
                <!-- Buttons will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Ending Screen (Three-Part Structure) -->
    <div id="ending-screen" class="screen flex-col items-center justify-center w-full max-w-2xl">
        <div class="story-card p-6 md:p-10 w-full text-center">
            <!-- Progress Indicator -->
            <div class="progress-dots mb-6">
                <div id="end-dot-1" class="progress-dot"></div>
                <div id="end-dot-2" class="progress-dot"></div>
                <div id="end-dot-3" class="progress-dot"></div>
            </div>

            <!-- Ending Badge -->
            <div class="mb-4">
                <span id="ending-emoji" class="text-6xl">🎉</span>
            </div>

            <h2 id="ending-title" class="text-2xl md:text-3xl font-extrabold text-purple-600 mb-6">
                The End!
            </h2>

            <!-- Part Label -->
            <div class="text-center mb-4">
                <span id="ending-part-label" class="text-gray-500 text-sm uppercase tracking-wide font-semibold">Story</span>
            </div>

            <!-- Story Content (parts-based or single narrative) -->
            <div id="ending-parts-container" class="mb-6 text-left">
                <!-- Parts will be inserted here dynamically -->
            </div>

            <!-- Fallback single narrative (hidden when using parts) -->
            <div id="ending-part-content" class="part-content rounded-2xl p-6 mb-6 hidden">
                <p id="ending-narrative" class="text-gray-700 text-xl md:text-2xl leading-relaxed">...</p>
            </div>

            <!-- Goal Outcome (shown during goal_resolution) -->
            <div id="goal-outcome-container" class="rounded-2xl p-4 mb-6 hidden">
                <p id="goal-outcome" class="font-semibold text-lg">...</p>
            </div>

            <!-- Teaching Moment (shown during reflection) -->
            <div id="teaching-container" class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-4 mb-6 hidden">
                <p class="text-green-800 font-bold text-lg mb-2">✨ What We Learned:</p>
                <p id="teaching-moment" class="text-green-700 text-lg leading-relaxed">...</p>
            </div>

            <!-- Parent Talking Point (shown during reflection) -->
            <div id="parent-container" class="bg-yellow-100 rounded-2xl p-4 mb-6 hidden">
                <p class="text-yellow-800 font-bold text-lg mb-2">👨‍👩‍👧 Talk Together:</p>
                <p id="parent-talking-point" class="text-yellow-700 text-lg">...</p>
            </div>

            <!-- Continue Button (shown between parts) -->
            <div id="ending-continue-container" class="flex justify-center hidden">
                <button onclick="showNextEndingPart()" class="continue-btn choice-btn text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-full">
                    Continue ➡️
                </button>
            </div>

            <!-- End Options (only after all parts shown) -->
            <div id="end-options-container" class="flex flex-col sm:flex-row gap-4 justify-center hidden">
                <!-- Buttons will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = 'https://ben9thave.app.n8n.cloud/webhook/story-interaction';

        // State
        let currentStoryId = null;
        let currentSceneId = null;
        let currentSessionId = null;

        // Screen Management
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Reset body classes
        function resetBodyClasses() {
            document.body.className = 'min-h-screen flex items-center justify-center p-4';
        }

        // API Calls
        async function apiCall(data) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                alert('Oops! Something went wrong. Let\'s try again!');
                showScreen('start-screen');
                return null;
            }
        }

        // Start New Story
        async function startNewStory() {
            resetBodyClasses();
            showScreen('loading-screen');

            const data = await apiCall({ action: 'new_story' });

            if (data) {
                currentStoryId = data.story_id;
                currentSceneId = data.scene_id;
                currentSessionId = data.session_id;

                // Detection: is_ending === true means ending screen
                if (data.is_ending === true) {
                    displayEnding(data);
                } else {
                    displayScene(data);
                }
            }
        }

        // Make a Choice
        async function makeChoice(choice) {
            showScreen('loading-screen');

            const data = await apiCall({
                action: 'make_choice',
                story_id: currentStoryId,
                current_scene_id: currentSceneId,
                session_id: currentSessionId,
                choice: choice
            });

            if (data) {
                currentSceneId = data.scene_id;
                if (data.session_id) currentSessionId = data.session_id;

                // Detection: is_ending === true means ending screen
                if (data.is_ending === true) {
                    displayEnding(data);
                } else {
                    displayScene(data);
                }
            }
        }

        // Get scene type
        function getSceneType(data) {
            if (data.scene_id === "scene_1") {
                return "opening";
            } else if (data.is_ending === true) {
                return "ending";
            } else {
                return "decision";  // scenes 2-3
            }
        }

        // Check if parts exist and have content
        function hasParts(data) {
            return data.parts && Object.values(data.parts).some(p => p !== null && p !== undefined && p !== '');
        }

        // Render parts with visual separation
        function renderPartsView(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const parts = data.parts;
            const sceneType = getSceneType(data);

            if (sceneType === 'opening') {
                // Opening scene: opening → transition → decision
                if (parts.opening) {
                    container.innerHTML += `
                        <div class="story-part opening">
                            <div class="part-label-inline">✨ Once upon a time...</div>
                            <div class="part-text">${parts.opening}</div>
                        </div>`;
                }
                if (parts.transition) {
                    container.innerHTML += `
                        <div class="story-part transition">
                            <div class="part-label-inline">👋 And then...</div>
                            <div class="part-text">${parts.transition}</div>
                        </div>`;
                }
                if (parts.decision) {
                    container.innerHTML += `
                        <div class="story-part decision">
                            <div class="part-label-inline">🤔 Hmm...</div>
                            <div class="part-text">${parts.decision}</div>
                        </div>`;
                }
            } else if (sceneType === 'ending') {
                // Ending scene: consequence → resolution
                if (parts.consequence) {
                    container.innerHTML += `
                        <div class="story-part consequence">
                            <div class="part-label-inline">✨ What happened...</div>
                            <div class="part-text">${parts.consequence}</div>
                        </div>`;
                }
                if (parts.resolution) {
                    container.innerHTML += `
                        <div class="story-part resolution">
                            <div class="part-label-inline">🌟 The End</div>
                            <div class="part-text">${parts.resolution}</div>
                        </div>`;
                }
            } else {
                // Decision scenes (2-3): consequence → transition → decision
                if (parts.consequence) {
                    container.innerHTML += `
                        <div class="story-part consequence">
                            <div class="part-label-inline">✨ What happened...</div>
                            <div class="part-text">${parts.consequence}</div>
                        </div>`;
                }
                if (parts.transition) {
                    container.innerHTML += `
                        <div class="story-part transition">
                            <div class="part-label-inline">🚶 Meanwhile...</div>
                            <div class="part-text">${parts.transition}</div>
                        </div>`;
                }
                if (parts.decision) {
                    container.innerHTML += `
                        <div class="story-part decision">
                            <div class="part-label-inline">🤔 Hmm...</div>
                            <div class="part-text">${parts.decision}</div>
                        </div>`;
                }
            }
        }

        // Display Scene (opening or decision)
        function displayScene(data) {
            const sceneType = getSceneType(data);

            // Hide progress dots
            document.querySelector('#scene-screen .progress-dots').classList.add('hidden');
            document.getElementById('continue-container').classList.add('hidden');

            // Show character badge only on opening scene
            const badgeContainer = document.getElementById('character-badge-container');
            if (sceneType === 'opening') {
                badgeContainer.classList.remove('hidden');
                document.getElementById('character-name').textContent = data.character_name || 'Milo';
                document.getElementById('part-icon').textContent = '🌟';
                document.getElementById('part-label').textContent = 'Our Story Begins';
            } else {
                badgeContainer.classList.add('hidden');
                document.getElementById('part-icon').textContent = '📖';
                document.getElementById('part-label').textContent = 'Story';
            }

            // Hide emotional beat container (consequence is now in parts)
            document.getElementById('emotional-beat-container').classList.add('hidden');

            // Check if parts exist (new format) or fall back to narrative (old format)
            const partsContainer = document.getElementById('story-parts-container');
            const narrativeContainer = document.getElementById('part-content');

            if (hasParts(data)) {
                // NEW: Render with visual separation
                partsContainer.classList.remove('hidden');
                narrativeContainer.classList.add('hidden');
                renderPartsView(data, 'story-parts-container');
            } else {
                // FALLBACK: Render single narrative
                partsContainer.classList.add('hidden');
                narrativeContainer.classList.remove('hidden');
                narrativeContainer.className = 'part-content rounded-2xl p-6 mb-6 bg-gradient-to-br from-blue-50 to-purple-50';
                document.getElementById('narrative-text').textContent = data.narrative || '';
            }

            // Display teaching_moment (lesson topic)
            const subLessonContainer = document.getElementById('sub-lesson-container');
            if (data.teaching_moment) {
                subLessonContainer.classList.remove('hidden');
                document.getElementById('sub-lesson').textContent = data.teaching_moment;
            } else {
                subLessonContainer.classList.add('hidden');
            }

            // Generate choice buttons from response.choices[]
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            if (data.choices && data.choices.length >= 2) {
                // First choice (good)
                const goodBtn = document.createElement('button');
                goodBtn.className = 'choice-btn good-choice text-white text-xl md:text-2xl font-bold py-5 px-8 rounded-full';
                goodBtn.innerHTML = `💚 ${data.choices[0].label}`;
                goodBtn.onclick = () => makeChoice(data.choices[0].choice);
                container.appendChild(goodBtn);

                // Second choice (bad)
                const badBtn = document.createElement('button');
                badBtn.className = 'choice-btn other-choice text-white text-xl md:text-2xl font-bold py-5 px-8 rounded-full';
                badBtn.innerHTML = `🤔 ${data.choices[1].label}`;
                badBtn.onclick = () => makeChoice(data.choices[1].choice);
                container.appendChild(badBtn);
            }

            showScreen('scene-screen');
        }

        // Display Ending (is_ending === true)
        function displayEnding(data) {
            // Hide progress dots
            document.querySelector('#ending-screen .progress-dots').classList.add('hidden');
            document.getElementById('ending-continue-container').classList.add('hidden');

            // Get ending_type for styling
            const endingType = data.ending_type || 'reflective';

            // Apply background styling based on ending_type
            resetBodyClasses();
            document.body.classList.add(`tier-${endingType}`);

            // Set ending emoji and title based on ending_type
            const endingEmoji = document.getElementById('ending-emoji');
            const endingTitle = document.getElementById('ending-title');

            if (endingType === 'celebration') {
                endingEmoji.textContent = '🎉';
                endingTitle.textContent = 'Wonderful Ending!';
                setTimeout(createConfetti, 500);
            } else if (endingType === 'satisfied') {
                endingEmoji.textContent = '😊';
                endingTitle.textContent = 'Great Ending!';
                setTimeout(createStars, 500);
            } else if (endingType === 'hopeful') {
                endingEmoji.textContent = '🌟';
                endingTitle.textContent = 'The End!';
            } else if (endingType === 'reflective') {
                endingEmoji.textContent = '🤔';
                endingTitle.textContent = "Let's Think About It!";
            } else {
                endingEmoji.textContent = '📖';
                endingTitle.textContent = 'The End!';
            }

            // Hide part label (no longer used for consequence)
            document.getElementById('ending-part-label').textContent = '';

            // Check if parts exist (new format) or fall back to narrative (old format)
            const partsContainer = document.getElementById('ending-parts-container');
            const narrativeContainer = document.getElementById('ending-part-content');

            if (hasParts(data)) {
                // NEW: Render with visual separation
                partsContainer.classList.remove('hidden');
                narrativeContainer.classList.add('hidden');
                renderPartsView(data, 'ending-parts-container');
            } else {
                // FALLBACK: Render single narrative
                partsContainer.classList.add('hidden');
                narrativeContainer.classList.remove('hidden');
                narrativeContainer.className = 'part-content rounded-2xl p-6 mb-6 bg-gradient-to-br from-blue-50 to-purple-50';
                document.getElementById('ending-narrative').textContent = data.narrative || '';
            }

            // Display closing_feeling (emotional summary)
            const closingContainer = document.getElementById('goal-outcome-container');
            if (data.closing_feeling) {
                closingContainer.classList.remove('hidden');
                closingContainer.className = 'ending-info mb-6';
                document.getElementById('goal-outcome').className = 'closing-feeling-box';
                document.getElementById('goal-outcome').textContent = `"${data.closing_feeling}"`;
            } else {
                closingContainer.classList.add('hidden');
            }

            // Display final_message as the lesson/moral
            const teachingContainer = document.getElementById('teaching-container');
            if (data.final_message) {
                teachingContainer.classList.remove('hidden');
                document.getElementById('teaching-moment').textContent = data.final_message;
            } else {
                teachingContainer.classList.add('hidden');
            }

            // Hide parent talking point container
            document.getElementById('parent-container').classList.add('hidden');

            // Generate action buttons from options[] or use defaults
            const optionsContainer = document.getElementById('end-options-container');
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('hidden');

            if (data.options && data.options.length > 0) {
                // Use options from API
                data.options.forEach(option => {
                    const btn = document.createElement('button');
                    if (option.action === 'replay') {
                        btn.className = 'choice-btn other-choice text-white text-lg md:text-xl font-bold py-4 px-8 rounded-full';
                        btn.innerHTML = `🔄 ${option.label}`;
                        btn.onclick = () => handleEndingOption('replay');
                    } else if (option.action === 'new_story') {
                        btn.className = 'choice-btn good-choice text-white text-lg md:text-xl font-bold py-4 px-8 rounded-full';
                        btn.innerHTML = `✨ ${option.label}`;
                        btn.onclick = () => handleEndingOption('new_story');
                    }
                    optionsContainer.appendChild(btn);
                });
            } else {
                // Default buttons
                const replayBtn = document.createElement('button');
                replayBtn.className = 'choice-btn other-choice text-white text-lg md:text-xl font-bold py-4 px-8 rounded-full';
                replayBtn.innerHTML = '🔄 Try Different Choices';
                replayBtn.onclick = () => handleEndingOption('replay');
                optionsContainer.appendChild(replayBtn);

                const newBtn = document.createElement('button');
                newBtn.className = 'choice-btn good-choice text-white text-lg md:text-xl font-bold py-4 px-8 rounded-full';
                newBtn.innerHTML = '✨ New Story';
                newBtn.onclick = () => handleEndingOption('new_story');
                optionsContainer.appendChild(newBtn);
            }

            showScreen('ending-screen');
        }

        // Handle ending option buttons
        async function handleEndingOption(action) {
            showScreen('loading-screen');

            const data = await apiCall({
                action: action,
                story_id: currentStoryId,
                session_id: currentSessionId
            });

            if (data) {
                currentSceneId = data.scene_id;
                if (data.session_id) currentSessionId = data.session_id;
                if (data.story_id) currentStoryId = data.story_id;

                resetBodyClasses();

                if (data.is_ending === true) {
                    displayEnding(data);
                } else {
                    displayScene(data);
                }
            }
        }

        // Confetti Effect
        function createConfetti() {
            const colors = ['#f472b6', '#818cf8', '#4ade80', '#fbbf24', '#60a5fa', '#f87171'];

            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 40);
            }
        }

        // Stars Effect
        function createStars() {
            const starEmojis = ['⭐', '🌟', '✨'];

            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.position = 'fixed';
                    star.style.left = (Math.random() * 80 + 10) + 'vw';
                    star.style.top = (Math.random() * 60 + 20) + 'vh';
                    star.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    star.style.animation = 'twinkle 1s ease-in-out forwards';
                    star.style.pointerEvents = 'none';
                    star.textContent = starEmojis[Math.floor(Math.random() * starEmojis.length)];
                    document.body.appendChild(star);

                    setTimeout(() => star.remove(), 1500);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
