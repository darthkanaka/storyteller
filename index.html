<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Time Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            transition: background 0.5s ease;
        }

        /* Emotional tier backgrounds */
        body.tier-celebration {
            background: linear-gradient(135deg, #fbbf24 0%, #f472b6 50%, #a78bfa 100%);
        }
        body.tier-satisfied {
            background: linear-gradient(135deg, #4ade80 0%, #22d3ee 50%, #818cf8 100%);
        }
        body.tier-reflective {
            background: linear-gradient(135deg, #94a3b8 0%, #a78bfa 50%, #f0abfc 100%);
        }
        body.tier-uncomfortable {
            background: linear-gradient(135deg, #fbbf24 0%, #fb923c 50%, #94a3b8 100%);
        }
        body.tier-disappointed {
            background: linear-gradient(135deg, #64748b 0%, #94a3b8 50%, #a78bfa 100%);
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .part-content {
            animation: slideIn 0.4s ease-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 40px rgba(251, 191, 36, 0.8); }
        }

        .bounce {
            animation: bounce 2s infinite;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        .glow {
            animation: glow 2s infinite;
        }

        .choice-btn {
            transition: all 0.3s ease;
        }

        .choice-btn:hover {
            transform: scale(1.05);
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        .good-choice {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 8px 0 #16a34a, 0 15px 20px rgba(0,0,0,0.2);
        }

        .good-choice:active {
            box-shadow: 0 4px 0 #16a34a, 0 8px 15px rgba(0,0,0,0.2);
            transform: translateY(4px) scale(0.95);
        }

        .other-choice {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 8px 0 #d97706, 0 15px 20px rgba(0,0,0,0.2);
        }

        .other-choice:active {
            box-shadow: 0 4px 0 #d97706, 0 8px 15px rgba(0,0,0,0.2);
            transform: translateY(4px) scale(0.95);
        }

        .continue-btn {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            box-shadow: 0 6px 0 #2563eb, 0 12px 20px rgba(0,0,0,0.2);
        }

        .continue-btn:active {
            box-shadow: 0 3px 0 #2563eb, 0 6px 15px rgba(0,0,0,0.2);
            transform: translateY(3px);
        }

        .start-btn {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
            box-shadow: 0 10px 0 #be185d, 0 20px 30px rgba(0,0,0,0.3);
        }

        .start-btn:active {
            box-shadow: 0 5px 0 #be185d, 0 10px 20px rgba(0,0,0,0.3);
            transform: translateY(5px);
        }

        .story-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .character-badge {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
        }

        /* Part type styles */
        .part-opening {
            border-left: 4px solid #818cf8;
            background: linear-gradient(135deg, #ede9fe 0%, #e0e7ff 100%);
        }

        .part-consequence {
            border-left: 4px solid #f472b6;
            background: linear-gradient(135deg, #fce7f3 0%, #fdf2f8 100%);
        }

        .part-transition {
            border-left: 4px solid #60a5fa;
            background: linear-gradient(135deg, #dbeafe 0%, #e0f2fe 100%);
        }

        .part-decision {
            border-left: 4px solid #fbbf24;
            background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 100%);
        }

        .part-goal-resolution {
            border-left: 4px solid #4ade80;
            background: linear-gradient(135deg, #dcfce7 0%, #f0fdf4 100%);
        }

        .part-reflection {
            border-left: 4px solid #a78bfa;
            background: linear-gradient(135deg, #f3e8ff 0%, #faf5ff 100%);
        }

        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: fall 3s linear forwards;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .stars {
            position: fixed;
            pointer-events: none;
        }

        .star {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 1s ease-in-out forwards;
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
            100% { opacity: 0; transform: scale(0.5) rotate(360deg); }
        }

        /* Progress indicator */
        .progress-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: white;
            transform: scale(1.2);
        }

        .progress-dot.completed {
            background: #4ade80;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Start Screen -->
    <div id="start-screen" class="screen active flex-col items-center justify-center text-center w-full max-w-lg">
        <div class="mb-8">
            <span class="text-8xl bounce inline-block">📚</span>
        </div>
        <h1 class="text-5xl md:text-6xl font-extrabold text-white mb-4 drop-shadow-lg">
            Story Time!
        </h1>
        <p class="text-xl md:text-2xl text-white/90 mb-12 drop-shadow">
            Let's go on an adventure together!
        </p>
        <button onclick="startNewStory()" class="start-btn choice-btn text-white text-2xl md:text-3xl font-bold py-6 px-12 rounded-full">
            🌟 Start Adventure 🌟
        </button>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="screen flex-col items-center justify-center text-center">
        <div class="loading-spinner mb-6"></div>
        <p class="text-2xl text-white font-bold">Getting your story ready...</p>
    </div>

    <!-- Scene Screen (Three-Part Structure) -->
    <div id="scene-screen" class="screen flex-col items-center justify-center w-full max-w-2xl">
        <div class="story-card p-6 md:p-10 w-full">
            <!-- Progress Indicator -->
            <div class="progress-dots mb-6">
                <div id="dot-1" class="progress-dot"></div>
                <div id="dot-2" class="progress-dot"></div>
                <div id="dot-3" class="progress-dot"></div>
            </div>

            <!-- Character Badge (only on scene 1) -->
            <div id="character-badge-container" class="flex justify-center mb-6 hidden">
                <span class="character-badge text-white text-xl md:text-2xl font-bold py-2 px-6 rounded-full">
                    Meet <span id="character-name">...</span>!
                </span>
            </div>

            <!-- Part Icon -->
            <div class="text-center mb-4">
                <span id="part-icon" class="text-5xl">📖</span>
            </div>

            <!-- Part Label -->
            <div class="text-center mb-4">
                <span id="part-label" class="text-gray-500 text-sm uppercase tracking-wide font-semibold">Story</span>
            </div>

            <!-- Story Content -->
            <div id="part-content" class="part-content rounded-2xl p-6 mb-6">
                <p id="narrative-text" class="text-gray-700 text-xl md:text-2xl leading-relaxed">...</p>
            </div>

            <!-- Sub-lesson (shown during decision_setup) -->
            <div id="sub-lesson-container" class="bg-purple-100 rounded-2xl p-4 mb-6 text-center hidden">
                <span class="text-2xl">💡</span>
                <p id="sub-lesson" class="text-purple-700 font-semibold text-lg">...</p>
            </div>

            <!-- Emotional Beat -->
            <div id="emotional-beat-container" class="text-center mb-6">
                <span id="emotional-beat" class="text-gray-500 italic text-lg">...</span>
            </div>

            <!-- Continue Button (shown between parts) -->
            <div id="continue-container" class="flex justify-center hidden">
                <button onclick="showNextPart()" class="continue-btn choice-btn text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-full">
                    Continue ➡️
                </button>
            </div>

            <!-- Choice Buttons (only after decision_setup) -->
            <div id="choices-container" class="flex flex-col gap-4 hidden">
                <!-- Buttons will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Ending Screen (Three-Part Structure) -->
    <div id="ending-screen" class="screen flex-col items-center justify-center w-full max-w-2xl">
        <div class="story-card p-6 md:p-10 w-full text-center">
            <!-- Progress Indicator -->
            <div class="progress-dots mb-6">
                <div id="end-dot-1" class="progress-dot"></div>
                <div id="end-dot-2" class="progress-dot"></div>
                <div id="end-dot-3" class="progress-dot"></div>
            </div>

            <!-- Ending Badge -->
            <div class="mb-4">
                <span id="ending-emoji" class="text-6xl">🎉</span>
            </div>

            <h2 id="ending-title" class="text-2xl md:text-3xl font-extrabold text-purple-600 mb-6">
                The End!
            </h2>

            <!-- Part Label -->
            <div class="text-center mb-4">
                <span id="ending-part-label" class="text-gray-500 text-sm uppercase tracking-wide font-semibold">Story</span>
            </div>

            <!-- Story Content -->
            <div id="ending-part-content" class="part-content rounded-2xl p-6 mb-6">
                <p id="ending-narrative" class="text-gray-700 text-xl md:text-2xl leading-relaxed">...</p>
            </div>

            <!-- Goal Outcome (shown during goal_resolution) -->
            <div id="goal-outcome-container" class="rounded-2xl p-4 mb-6 hidden">
                <p id="goal-outcome" class="font-semibold text-lg">...</p>
            </div>

            <!-- Teaching Moment (shown during reflection) -->
            <div id="teaching-container" class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-4 mb-6 hidden">
                <p class="text-green-800 font-bold text-lg mb-2">✨ What We Learned:</p>
                <p id="teaching-moment" class="text-green-700 text-lg leading-relaxed">...</p>
            </div>

            <!-- Parent Talking Point (shown during reflection) -->
            <div id="parent-container" class="bg-yellow-100 rounded-2xl p-4 mb-6 hidden">
                <p class="text-yellow-800 font-bold text-lg mb-2">👨‍👩‍👧 Talk Together:</p>
                <p id="parent-talking-point" class="text-yellow-700 text-lg">...</p>
            </div>

            <!-- Continue Button (shown between parts) -->
            <div id="ending-continue-container" class="flex justify-center hidden">
                <button onclick="showNextEndingPart()" class="continue-btn choice-btn text-white text-xl md:text-2xl font-bold py-4 px-10 rounded-full">
                    Continue ➡️
                </button>
            </div>

            <!-- End Options (only after all parts shown) -->
            <div id="end-options-container" class="flex flex-col sm:flex-row gap-4 justify-center hidden">
                <!-- Buttons will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = 'https://ben9thave.app.n8n.cloud/webhook/story-interaction';

        // State
        let currentStoryId = null;
        let currentSceneId = null;
        let currentSceneData = null;
        let currentPartIndex = 0;
        let sceneParts = [];
        let isEnding = false;

        // Screen Management
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Reset body classes
        function resetBodyClasses() {
            document.body.className = 'min-h-screen flex items-center justify-center p-4';
        }

        // API Calls
        async function apiCall(data) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                alert('Oops! Something went wrong. Let\'s try again!');
                showScreen('start-screen');
                return null;
            }
        }

        // Start New Story
        async function startNewStory() {
            resetBodyClasses();
            showScreen('loading-screen');

            const data = await apiCall({ action: 'new_story' });

            if (data) {
                currentStoryId = data.story_id;
                currentSceneId = data.scene_id;
                currentSceneData = data;

                if (data.is_ending) {
                    setupEndingParts(data);
                } else {
                    setupSceneParts(data);
                }
            }
        }

        // Make a Choice
        async function makeChoice(choice) {
            showScreen('loading-screen');

            const data = await apiCall({
                action: 'make_choice',
                story_id: currentStoryId,
                current_scene_id: currentSceneId,
                choice: choice
            });

            if (data) {
                currentSceneId = data.scene_id;
                currentSceneData = data;

                if (data.is_ending) {
                    setupEndingParts(data);
                } else {
                    setupSceneParts(data);
                }
            }
        }

        // Replay Story
        async function replayStory() {
            resetBodyClasses();
            showScreen('loading-screen');

            const data = await apiCall({
                action: 'replay',
                story_id: currentStoryId
            });

            if (data) {
                currentSceneId = data.scene_id;
                currentSceneData = data;

                if (data.is_ending) {
                    setupEndingParts(data);
                } else {
                    setupSceneParts(data);
                }
            }
        }

        // Setup Scene Parts (Non-Ending Scenes)
        function setupSceneParts(data) {
            isEnding = false;
            sceneParts = [];
            currentPartIndex = 0;

            // Determine if this is scene 1 (has opening) or scene 2-3 (has consequence)
            if (data.opening) {
                // Scene 1: opening → transition → decision_setup
                sceneParts.push({
                    type: 'opening',
                    narrative: data.opening.narrative,
                    emotional_beat: data.opening.emotional_beat,
                    icon: '🌟',
                    label: 'Our Story Begins'
                });
            } else if (data.consequence) {
                // Scenes 2-3: consequence → transition → decision_setup
                sceneParts.push({
                    type: 'consequence',
                    narrative: data.consequence.narrative,
                    emotional_beat: data.consequence.emotional_beat,
                    reinforcement: data.consequence.reinforcement,
                    icon: data.consequence.reinforcement === 'positive' ? '😊' : '😟',
                    label: 'What Happened'
                });
            }

            if (data.transition) {
                sceneParts.push({
                    type: 'transition',
                    narrative: data.transition.narrative,
                    location: data.transition.location,
                    icon: '🚶',
                    label: data.transition.location || 'Meanwhile...'
                });
            }

            if (data.decision_setup) {
                sceneParts.push({
                    type: 'decision',
                    narrative: data.decision_setup.narrative,
                    sub_lesson: data.decision_setup.sub_lesson,
                    tension: data.decision_setup.tension,
                    prompt: data.decision_setup.prompt,
                    good_choice: data.decision_setup.good_choice,
                    bad_choice: data.decision_setup.bad_choice,
                    icon: '🤔',
                    label: 'Decision Time'
                });
            }

            // Fallback for flat structure (backward compatibility)
            if (sceneParts.length === 0) {
                sceneParts.push({
                    type: 'story',
                    narrative: data.narrative || data.story_summary || '',
                    icon: '📖',
                    label: 'Story'
                });
                if (data.decision_setup || data.choices) {
                    sceneParts.push({
                        type: 'decision',
                        narrative: typeof data.decision_setup === 'string' ? data.decision_setup : '',
                        icon: '🤔',
                        label: 'Decision Time'
                    });
                }
            }

            // Show character badge only on scene 1
            const badgeContainer = document.getElementById('character-badge-container');
            if (data.level === 1 || data.scene_id === 'scene_1') {
                badgeContainer.classList.remove('hidden');
                document.getElementById('character-name').textContent = data.character_name || 'Milo';
            } else {
                badgeContainer.classList.add('hidden');
            }

            showScenePart(0);
            showScreen('scene-screen');
        }

        // Show a specific scene part
        function showScenePart(index) {
            currentPartIndex = index;
            const part = sceneParts[index];

            // Update progress dots
            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById(`dot-${i}`);
                dot.classList.remove('active', 'completed');
                if (i - 1 < index) dot.classList.add('completed');
                if (i - 1 === index) dot.classList.add('active');
            }

            // Update icon and label
            document.getElementById('part-icon').textContent = part.icon;
            document.getElementById('part-label').textContent = part.label;

            // Update content styling based on part type
            const contentDiv = document.getElementById('part-content');
            contentDiv.className = 'part-content rounded-2xl p-6 mb-6';
            contentDiv.classList.add(`part-${part.type}`);

            // Update narrative
            document.getElementById('narrative-text').textContent = part.narrative || '';

            // Handle emotional beat
            const emotionalContainer = document.getElementById('emotional-beat-container');
            if (part.emotional_beat) {
                emotionalContainer.classList.remove('hidden');
                document.getElementById('emotional-beat').textContent = part.emotional_beat;
            } else {
                emotionalContainer.classList.add('hidden');
            }

            // Handle sub-lesson (only for decision type)
            const subLessonContainer = document.getElementById('sub-lesson-container');
            if (part.type === 'decision' && part.sub_lesson) {
                subLessonContainer.classList.remove('hidden');
                document.getElementById('sub-lesson').textContent = part.sub_lesson;
            } else {
                subLessonContainer.classList.add('hidden');
            }

            // Show continue or choices based on whether this is the last part
            const continueContainer = document.getElementById('continue-container');
            const choicesContainer = document.getElementById('choices-container');

            if (index < sceneParts.length - 1) {
                // Not the last part - show continue button
                continueContainer.classList.remove('hidden');
                choicesContainer.classList.add('hidden');
            } else {
                // Last part - show choices
                continueContainer.classList.add('hidden');
                choicesContainer.classList.remove('hidden');
                generateChoiceButtons(part);
            }

            // Trigger animation
            contentDiv.style.animation = 'none';
            contentDiv.offsetHeight; // Trigger reflow
            contentDiv.style.animation = 'slideIn 0.4s ease-out';
        }

        // Show next part
        function showNextPart() {
            if (currentPartIndex < sceneParts.length - 1) {
                showScenePart(currentPartIndex + 1);
            }
        }

        // Generate choice buttons
        function generateChoiceButtons(part) {
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            // Use the new structure if available
            if (part.good_choice && part.bad_choice) {
                const goodBtn = document.createElement('button');
                goodBtn.className = 'choice-btn good-choice text-white text-xl md:text-2xl font-bold py-5 px-8 rounded-full';
                goodBtn.innerHTML = `💚 ${part.good_choice.label}`;
                goodBtn.onclick = () => makeChoice('good');
                container.appendChild(goodBtn);

                const badBtn = document.createElement('button');
                badBtn.className = 'choice-btn other-choice text-white text-xl md:text-2xl font-bold py-5 px-8 rounded-full';
                badBtn.innerHTML = `🤔 ${part.bad_choice.label}`;
                badBtn.onclick = () => makeChoice('bad');
                container.appendChild(badBtn);
            } else if (currentSceneData.choices && currentSceneData.choices.length > 0) {
                // Fallback to old structure
                currentSceneData.choices.forEach((choice) => {
                    const btn = document.createElement('button');
                    btn.className = `choice-btn text-white text-xl md:text-2xl font-bold py-5 px-8 rounded-full ${
                        choice.choice === 'good' ? 'good-choice' : 'other-choice'
                    }`;
                    const emoji = choice.choice === 'good' ? '💚' : '🤔';
                    btn.innerHTML = `${emoji} ${choice.label}`;
                    btn.onclick = () => makeChoice(choice.choice);
                    container.appendChild(btn);
                });
            }
        }

        // Setup Ending Parts
        function setupEndingParts(data) {
            isEnding = true;
            sceneParts = [];
            currentPartIndex = 0;

            // Apply emotional tier styling
            if (data.emotional_tier) {
                document.body.classList.add(`tier-${data.emotional_tier}`);
            }

            // Set ending emoji and title based on ending_type
            const endingEmoji = document.getElementById('ending-emoji');
            const endingTitle = document.getElementById('ending-title');

            if (data.ending_type === 'best_outcome') {
                endingEmoji.textContent = '🎉';
                endingTitle.textContent = 'Wonderful Ending!';
            } else if (data.ending_type === 'mostly_positive' || data.ending_type === 'redemption') {
                endingEmoji.textContent = '⭐';
                endingTitle.textContent = 'Great Ending!';
            } else if (data.ending_type === 'mixed' || data.ending_type === 'late_redemption') {
                endingEmoji.textContent = '🌈';
                endingTitle.textContent = 'The End!';
            } else if (data.ending_type === 'learning_opportunity') {
                endingEmoji.textContent = '💭';
                endingTitle.textContent = "Let's Try Again!";
            } else {
                endingEmoji.textContent = '📖';
                endingTitle.textContent = 'Story Complete!';
            }

            // Build ending parts: consequence → goal_resolution → reflection
            if (data.consequence) {
                sceneParts.push({
                    type: 'consequence',
                    narrative: data.consequence.narrative,
                    emotional_beat: data.consequence.emotional_beat,
                    icon: data.consequence.reinforcement === 'positive' ? '😊' : '😟',
                    label: 'What Happened'
                });
            }

            if (data.goal_resolution) {
                sceneParts.push({
                    type: 'goal-resolution',
                    narrative: data.goal_resolution.narrative,
                    goal_outcome: data.goal_resolution.goal_outcome,
                    goal_callback: data.goal_resolution.goal_callback,
                    icon: data.goal_resolution.goal_outcome === 'achieved' ? '🏆' :
                          data.goal_resolution.goal_outcome === 'partial' ? '🌟' : '💭',
                    label: data.goal_resolution.goal_outcome === 'achieved' ? 'Goal Achieved!' :
                           data.goal_resolution.goal_outcome === 'partial' ? 'Almost There!' : 'Next Time...'
                });
            }

            if (data.reflection) {
                sceneParts.push({
                    type: 'reflection',
                    narrative: data.reflection.narrative,
                    teaching_moment: data.reflection.teaching_moment,
                    final_feeling: data.reflection.final_feeling,
                    parent_talking_point: data.reflection.parent_talking_point,
                    icon: '💝',
                    label: 'What We Learned'
                });
            }

            // Fallback for flat structure
            if (sceneParts.length === 0) {
                sceneParts.push({
                    type: 'story',
                    narrative: data.narrative || data.story_summary || '',
                    teaching_moment: data.final_message || data.teaching_moment,
                    parent_talking_point: data.parent_talking_point,
                    icon: '📖',
                    label: 'The End'
                });
            }

            showEndingPart(0);
            showScreen('ending-screen');

            // Trigger celebration effects for best outcomes
            if (data.ending_type === 'best_outcome' || data.emotional_tier === 'celebration') {
                setTimeout(createConfetti, 500);
            } else if (data.emotional_tier === 'satisfied') {
                setTimeout(createStars, 500);
            }
        }

        // Show a specific ending part
        function showEndingPart(index) {
            currentPartIndex = index;
            const part = sceneParts[index];

            // Update progress dots
            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById(`end-dot-${i}`);
                dot.classList.remove('active', 'completed');
                if (i - 1 < index) dot.classList.add('completed');
                if (i - 1 === index) dot.classList.add('active');
            }

            // Update label
            document.getElementById('ending-part-label').textContent = part.label;

            // Update content styling
            const contentDiv = document.getElementById('ending-part-content');
            contentDiv.className = 'part-content rounded-2xl p-6 mb-6';
            contentDiv.classList.add(`part-${part.type}`);

            // Update narrative
            document.getElementById('ending-narrative').textContent = part.narrative || '';

            // Handle goal outcome display
            const goalContainer = document.getElementById('goal-outcome-container');
            if (part.type === 'goal-resolution' && part.goal_callback) {
                goalContainer.classList.remove('hidden');
                goalContainer.className = 'rounded-2xl p-4 mb-6';
                if (part.goal_outcome === 'achieved') {
                    goalContainer.classList.add('bg-green-100');
                    document.getElementById('goal-outcome').className = 'font-semibold text-lg text-green-700';
                } else if (part.goal_outcome === 'partial') {
                    goalContainer.classList.add('bg-yellow-100');
                    document.getElementById('goal-outcome').className = 'font-semibold text-lg text-yellow-700';
                } else {
                    goalContainer.classList.add('bg-gray-100');
                    document.getElementById('goal-outcome').className = 'font-semibold text-lg text-gray-700';
                }
                document.getElementById('goal-outcome').textContent = part.goal_callback;
            } else {
                goalContainer.classList.add('hidden');
            }

            // Handle teaching moment and parent talking point (only on reflection)
            const teachingContainer = document.getElementById('teaching-container');
            const parentContainer = document.getElementById('parent-container');

            if (part.type === 'reflection' || (index === sceneParts.length - 1 && part.teaching_moment)) {
                if (part.teaching_moment) {
                    teachingContainer.classList.remove('hidden');
                    document.getElementById('teaching-moment').textContent = part.teaching_moment;
                } else {
                    teachingContainer.classList.add('hidden');
                }

                if (part.parent_talking_point) {
                    parentContainer.classList.remove('hidden');
                    document.getElementById('parent-talking-point').textContent = part.parent_talking_point;
                } else {
                    parentContainer.classList.add('hidden');
                }
            } else {
                teachingContainer.classList.add('hidden');
                parentContainer.classList.add('hidden');
            }

            // Show continue or end options
            const continueContainer = document.getElementById('ending-continue-container');
            const optionsContainer = document.getElementById('end-options-container');

            if (index < sceneParts.length - 1) {
                continueContainer.classList.remove('hidden');
                optionsContainer.classList.add('hidden');
            } else {
                continueContainer.classList.add('hidden');
                optionsContainer.classList.remove('hidden');
                generateEndOptions();
            }

            // Trigger animation
            contentDiv.style.animation = 'none';
            contentDiv.offsetHeight;
            contentDiv.style.animation = 'slideIn 0.4s ease-out';
        }

        // Show next ending part
        function showNextEndingPart() {
            if (currentPartIndex < sceneParts.length - 1) {
                showEndingPart(currentPartIndex + 1);
            }
        }

        // Generate end option buttons
        function generateEndOptions() {
            const container = document.getElementById('end-options-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            if (currentSceneData.options && currentSceneData.options.length > 0) {
                currentSceneData.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn text-white text-lg md:text-xl font-bold py-4 px-8 rounded-full';

                    if (option.action === 'replay') {
                        btn.className += ' other-choice';
                        btn.innerHTML = `🔄 ${option.label}`;
                        btn.onclick = replayStory;
                    } else if (option.action === 'new_story') {
                        btn.className += ' good-choice';
                        btn.innerHTML = `✨ ${option.label}`;
                        btn.onclick = startNewStory;
                    }

                    container.appendChild(btn);
                });
            } else {
                // Default buttons
                const replayBtn = document.createElement('button');
                replayBtn.className = 'choice-btn other-choice text-white text-lg md:text-xl font-bold py-4 px-8 rounded-full';
                replayBtn.innerHTML = '🔄 Try Again';
                replayBtn.onclick = replayStory;
                container.appendChild(replayBtn);

                const newBtn = document.createElement('button');
                newBtn.className = 'choice-btn good-choice text-white text-lg md:text-xl font-bold py-4 px-8 rounded-full';
                newBtn.innerHTML = '✨ New Story';
                newBtn.onclick = startNewStory;
                container.appendChild(newBtn);
            }
        }

        // Confetti Effect
        function createConfetti() {
            const colors = ['#f472b6', '#818cf8', '#4ade80', '#fbbf24', '#60a5fa', '#f87171'];

            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 40);
            }
        }

        // Stars Effect
        function createStars() {
            const starEmojis = ['⭐', '🌟', '✨'];

            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.position = 'fixed';
                    star.style.left = (Math.random() * 80 + 10) + 'vw';
                    star.style.top = (Math.random() * 60 + 20) + 'vh';
                    star.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    star.style.animation = 'twinkle 1s ease-in-out forwards';
                    star.style.pointerEvents = 'none';
                    star.textContent = starEmojis[Math.floor(Math.random() * starEmojis.length)];
                    document.body.appendChild(star);

                    setTimeout(() => star.remove(), 1500);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
